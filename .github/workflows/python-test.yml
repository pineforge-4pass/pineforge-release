name: python-test

# Minimal PR/push gate for pure-Python regressions (no native engine): the
# focused fingerprint canonicalization contract test and the release-rule
# tests (scripts/release_pair.py and its wiring into the release workflows).

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  fingerprint-canonical:
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fingerprint canonical regression
        run: |
          python3 -m py_compile docker/run_json.py tests/test_fingerprint_canonical.py
          python3 tests/test_fingerprint_canonical.py

  release-rules:
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3' -r facts/requirements-validation.txt

      - name: Download published hpo wheels
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --max-time 120 \
            'https://github.com/pineforge-4pass/pineforge-hpo/releases/download/v0.15.0/pineforge_hpo-0.15.0-py3-none-any.whl' \
            -o pineforge_hpo-0.15.0-py3-none-any.whl
          printf '%s\n' 'ee09f5fd72fd43c26027c294d0e871ab6f3d856fbc5d28c53910a3bbcfa968a6  pineforge_hpo-0.15.0-py3-none-any.whl' > hpo-accepted.sha256
          sha256sum -c --strict hpo-accepted.sha256
          curl -fsSL --retry 3 --max-time 120 \
            'https://github.com/pineforge-4pass/pineforge-hpo/releases/download/v0.13.2/pineforge_hpo-0.13.2-py3-none-any.whl' \
            -o pineforge_hpo-0.13.2-py3-none-any.whl
          printf '%s\n' '57fff4c49cba794a9657e7882376eee294366843cf0442306195b8390dd0d073  pineforge_hpo-0.13.2-py3-none-any.whl' > hpo-rejected.sha256
          sha256sum -c --strict hpo-rejected.sha256
          {
            echo "PINEFORGE_HPO_ACCEPTED_WHEEL=$RUNNER_TEMP/pineforge_hpo-0.15.0-py3-none-any.whl"
            echo "PINEFORGE_HPO_REJECTED_WHEEL=$RUNNER_TEMP/pineforge_hpo-0.13.2-py3-none-any.whl"
          } >> "$GITHUB_ENV"

      - name: Release rules (version order, prerelease channel, 1.0 pairing)
        run: |
          python3 -m py_compile scripts/release_pair.py
          python3 -m unittest discover -s tests -p 'test_release_*.py' -v

  description-renderer:
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r facts/requirements-validation.txt
      - name: Existing description renderer acceptance regressions
        run: python3 -m unittest discover -s tests -p 'test_repo_descriptions.py' -v

  release-ready-replay:
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3' -r facts/requirements-validation.txt
      - name: Replay ready release and failure recovery without production credentials
        run: python3 tools/release-dry-run/dry_run.py --ready

  release-ready:
    name: release/ready
    if: ${{ always() }}
    needs: [fingerprint-canonical, release-rules, description-renderer, release-ready-replay]
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    steps:
      - name: Require the complete expected inventory
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'fingerprint-canonical', 'release-rules', 'description-renderer', 'release-ready-replay'}
          if set(results) != expected or any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('release/ready: a required job failed, was cancelled, skipped or missing')
          PY
