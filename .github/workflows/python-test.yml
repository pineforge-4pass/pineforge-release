name: python-test

# Minimal PR/push gate for pure-Python regressions (no native engine): the
# focused fingerprint canonicalization contract test and the release-rule
# tests (scripts/release_pair.py and its wiring into the release workflows).

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

permissions:
  contents: read

# Only superseded PR runs share a cancellable group. Other events use run_id.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authz:
    name: authz
    # Pool label (needs no toolchain or Docker). Switch to pf-ci-crj once laneboss's
    # bulletin says the Cloud Run class is live.
    runs-on: ["self-hosted", "pf-ci", "pf-ci-x64"]
    permissions: {}
    # No timeout-minutes: the owner's no-time-limits rule (check-no-time-limits refuses new ones).
    steps:
      - name: Only our own pull requests and our own events run CI
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ github.token }}   # read-only use: one permission lookup for workflow_run
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -eu
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            push|workflow_dispatch|schedule|merge_group|release|workflow_call|repository_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            workflow_run)
              # The pwn-request path: it runs in THIS repository with secrets even when the triggering run
              # came from a fork. Refuse ALWAYS unless the triggering run's head is this repository, and
              # apply the same identity rule to its triggering actor as to a pull-request author.
              [ "$WR_HEAD_REPO" = "$REPO" ] || fail "workflow_run triggered from another repository (${WR_HEAD_REPO:-unknown})"
              case " $ALLOWED_BOTS " in
                *" $WR_ACTOR "*) ;;
                *)
                  # No author_association exists on workflow_run: ask GitHub for the actor's permission on
                  # this repository; anything but admin/maintain/write (or a failed call) refuses.
                  perm=$(gh api "repos/$REPO/collaborators/$WR_ACTOR/permission" --jq .permission 2>/dev/null || echo none)
                  case "$perm" in admin|maintain|write) ;; *) fail "workflow_run triggering actor ${WR_ACTOR:-unknown} has permission '$perm', not write" ;; esac ;;
              esac ;;
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac ;;
            *) fail "event $EVENT does not run CI (pull_request_target and other events are not allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"

  changes:
    needs: authz
    runs-on: ["self-hosted","pf-ci","pf-ci-x64"]
    outputs:
      docs-only: ${{ steps.paths.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect documentation-only PR
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          docs_only = False
          if os.environ['EVENT_NAME'] == 'pull_request':
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA'], '--',
              ]).split(b'\0')
              paths = [PurePosixPath(os.fsdecode(path)) for path in paths if path]
              # Release tests consume these documents and scan automation files.
              test_inputs = {'README.md', 'docs/release-chain.md', 'LICENSE'}
              docs_only = bool(paths) and all(
                  str(path) not in test_inputs and
                  path.parts[:2] != ('.github', 'workflows') and
                  path.parts[0] not in {'scripts', 'tools'} and (
                      path.suffix in {'.md', '.rst'} or str(path) == 'LICENSE' or
                      (path.parts[0] == 'docs' and path.suffix in {
                          '.txt', '.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp', '.pdf',
                      })
                  )
                  for path in paths
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('docs-only=' + str(docs_only).lower() + '\n')
          PY

  fingerprint-canonical:
    needs: [authz, changes]
    if: needs.changes.outputs.docs-only == 'false'
    runs-on: ["self-hosted","pf-ci","pf-ci-x64"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Fingerprint canonical regression
        run: |
          python3 -m py_compile docker/run_json.py tests/test_fingerprint_canonical.py
          python3 tests/test_fingerprint_canonical.py

  release-rules:
    needs: [authz, changes]
    if: needs.changes.outputs.docs-only == 'false'
    runs-on: ["self-hosted","pf-ci","pf-ci-x64"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install workflow YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3' -r facts/requirements-validation.txt

      - name: Download published hpo wheels
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --max-time 120 \
            'https://github.com/pineforge-4pass/pineforge-hpo/releases/download/v0.15.0/pineforge_hpo-0.15.0-py3-none-any.whl' \
            -o pineforge_hpo-0.15.0-py3-none-any.whl
          printf '%s\n' 'ee09f5fd72fd43c26027c294d0e871ab6f3d856fbc5d28c53910a3bbcfa968a6  pineforge_hpo-0.15.0-py3-none-any.whl' > hpo-accepted.sha256
          sha256sum -c --strict hpo-accepted.sha256
          curl -fsSL --retry 3 --max-time 120 \
            'https://github.com/pineforge-4pass/pineforge-hpo/releases/download/v0.13.2/pineforge_hpo-0.13.2-py3-none-any.whl' \
            -o pineforge_hpo-0.13.2-py3-none-any.whl
          printf '%s\n' '57fff4c49cba794a9657e7882376eee294366843cf0442306195b8390dd0d073  pineforge_hpo-0.13.2-py3-none-any.whl' > hpo-rejected.sha256
          sha256sum -c --strict hpo-rejected.sha256
          {
            echo "PINEFORGE_HPO_ACCEPTED_WHEEL=$RUNNER_TEMP/pineforge_hpo-0.15.0-py3-none-any.whl"
            echo "PINEFORGE_HPO_REJECTED_WHEEL=$RUNNER_TEMP/pineforge_hpo-0.13.2-py3-none-any.whl"
          } >> "$GITHUB_ENV"

      - name: Release rules (version order, prerelease channel, 1.0 pairing)
        run: |
          python3 -m py_compile scripts/release_pair.py
          python3 -m unittest discover -s tests -p 'test_release_*.py' -v

  description-renderer:
    needs: [authz, changes]
    if: needs.changes.outputs.docs-only == 'false'
    runs-on: ["self-hosted","pf-ci","pf-ci-x64"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r facts/requirements-validation.txt
      - name: Existing description renderer acceptance regressions
        run: python3 -m unittest discover -s tests -p 'test_repo_descriptions.py' -v

  release-ready-replay:
    needs: [authz, changes]
    if: needs.changes.outputs.docs-only == 'false'
    runs-on: ["self-hosted","pf-ci","pf-ci-x64"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3' -r facts/requirements-validation.txt
      - name: Replay ready release and failure recovery without production credentials
        run: python3 tools/release-dry-run/dry_run.py --ready

  release-ready:
    name: release/ready
    if: ${{ always() }}
    needs: [authz, changes, fingerprint-canonical, release-rules, description-renderer, release-ready-replay]
    runs-on: ["self-hosted","pf-ci","pf-ci-x64"]
    steps:
      - name: Refuse an unauthorised run before anything else
        if: ${{ needs.authz.result != 'success' }}
        run: |
          echo "::error::authz did not pass; nothing of this run's code is checked out or run"
          exit 1
      - name: Require the complete expected inventory
        if: needs.authz.result == 'success'
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          AUTHZ_OK: ${{ needs.authz.result == 'success' }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'fingerprint-canonical', 'release-rules', 'description-renderer', 'release-ready-replay'}
          if set(results) != expected | {'authz', 'changes'} or results['changes']['result'] != 'success':
              raise SystemExit('release/ready: change detection failed or the job inventory differs')
          if os.environ['AUTHZ_OK'] != 'true' or results['authz']['result'] != 'success':
              raise SystemExit('release/ready: authz did not succeed')
          docs_only = results['changes']['outputs'].get('docs-only')
          if docs_only not in {'true', 'false'}:
              raise SystemExit('release/ready: missing or invalid change detection output')
          required_result = 'success'
          if docs_only == 'true':
              if os.environ['EVENT_NAME'] != 'pull_request':
                  raise SystemExit('release/ready: only a documentation-only PR may skip suites')
              required_result = 'skipped'
          if any(results[name]['result'] != required_result for name in expected):
              raise SystemExit('release/ready: a required job failed, was cancelled, skipped or missing')
          PY
