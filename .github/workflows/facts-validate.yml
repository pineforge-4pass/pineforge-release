name: facts-validate

on:
  pull_request:
    paths:
      - 'facts/**'
      - 'scripts/repo_descriptions.py'
      - 'scripts/facts_*.py'
      - 'tests/test_repo_descriptions.py'
      - 'tests/test_facts_*.py'
      - 'tests/test_release_workflows.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'facts/**'
      - 'scripts/repo_descriptions.py'
      - 'scripts/facts_*.py'
      - 'tests/test_repo_descriptions.py'
      - 'tests/test_facts_*.py'
      - 'tests/test_release_workflows.py'
      - '.github/workflows/**'

permissions:
  contents: read

# Only superseded PR runs share a cancellable group. Other events use run_id.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-24.04' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r facts/requirements-validation.txt
      - name: Validate the whole canonical document and descriptions
        run: |
          python3 scripts/facts_validate.py --facts facts/facts.json
          python3 scripts/repo_descriptions.py render --facts facts/facts.json
      - name: Render deterministic full and corpus SVGs and endpoint JSON
        run: |
          set -euo pipefail
          for variant in full corpus; do
            for theme in light dark; do
              python3 scripts/facts_cards.py --facts facts/facts.json --variant "$variant" --theme "$theme" > "$RUNNER_TEMP/$variant-$theme.svg"
              python3 scripts/facts_cards.py --facts facts/facts.json --variant "$variant" --theme "$theme" > "$RUNNER_TEMP/repeat.svg"
              cmp "$RUNNER_TEMP/$variant-$theme.svg" "$RUNNER_TEMP/repeat.svg"
            done
            python3 scripts/facts_cards.py --facts facts/facts.json --variant "$variant" --format json > "$RUNNER_TEMP/$variant.json"
          done
      - name: CLI acceptance including parsed SVG and JSON content
        run: python3 -m unittest discover -s tests -p 'test_facts_*.py' -v
