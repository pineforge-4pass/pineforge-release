name: handle-upstream

# Inbound hub handler. Fired by an upstream release:
#   pineforge-engine      release.yml -> event_type=engine-release  {version: vX.Y.Z, prerelease, run_id}
#   pineforge-codegen-oss release.yml -> event_type=codegen-release {version: X.Y.Z, prerelease, run_id}
# `prerelease` (true|false) is optional and must agree with the version.
#
# 0.x line: moves the dispatched component's pin, freezes the other one,
# patch-bumps THIS repo's VERSION, commits + tags with the org GitHub App token.
# From 1.0.0 on (scripts/release_pair.py) engine and codegen share one version,
# prerelease included: the first event of a pair records its pin in the run
# log and builds nothing; the partner's event finds the first one's published
# artifacts, and the release version becomes the pair version.
# The App-token-pushed tag fires publish.yml (build the combined image -> fan
# out to the MCPs and the app). A GITHUB_TOKEN-pushed tag would NOT re-trigger
# publish.yml; the App token (a non-default credential) does. Idempotent, with
# half-failed-release recovery, a downgrade guard, and serialized concurrency.

on:
  repository_dispatch:
    types: [engine-release, codegen-release]

concurrency:
  group: handle-upstream
  cancel-in-progress: false

permissions:
  contents: read   # GITHUB_TOKEN stays read-only; the App token does the push.

jobs:
  bump:
    runs-on: ubuntu-latest
    environment: release-automation
    steps:
      - name: Mint org App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: pineforge-4pass
          repositories: pineforge-release
          permission-contents: write
          github-api-url: https://api.github.com

      - name: Checkout main (App token bypasses the ruleset + re-fires publish.yml)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Validate payload
        id: in
        env:
          EVENT: ${{ github.event.action }}
          RAW_VERSION: ${{ github.event.client_payload.version }}
          RAW_PRERELEASE: ${{ github.event.client_payload.prerelease }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          set -euo pipefail
          # client_payload is ATTACKER-CONTROLLABLE -> strict allowlist before it
          # reaches a build-arg / pip pin / image ref / tag message.
          case "$EVENT" in
            engine-release)  component=engine ;;
            codegen-release) component=codegen ;;
            *) echo "::error::unexpected event '$EVENT'"; exit 1 ;;
          esac
          if ! printf '%s' "${RAW_VERSION:-}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$'; then
            echo "::error::rejected untrusted version '${RAW_VERSION:-}'"; exit 1
          fi
          case "${RAW_PRERELEASE:-}" in
            ''|true|false) ;;
            *) echo "::error::rejected untrusted prerelease '${RAW_PRERELEASE}'"; exit 1 ;;
          esac
          # Whole-value match: grep would accept a multi-line value line by line.
          if [ -n "${RUN_ID:-}" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::bad run_id"; exit 1
          fi
          # The release rules take X.Y.Z or X.Y.Z-{alpha,beta,rc}.N (one PyPI
          # spelling each); anything else fails here. Emits bare/line/prerelease/pypi.
          facts="$(python3 scripts/release_pair.py info "$RAW_VERSION")"
          VER="$(printf '%s\n' "$facts" | sed -n 's/^bare=//p')"
          {
            echo "component=$component"
            echo "version=$VER"
            echo "payload_prerelease=${RAW_PRERELEASE:-}"
            printf '%s\n' "$facts"
          } >> "$GITHUB_OUTPUT"
          echo "dispatched ${component}=${VER} (event ${EVENT}, prerelease ${RAW_PRERELEASE:-unset}, upstream run ${RUN_ID:-n/a})"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Log in to GHCR (read, for the image-exists probe)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The landed pins live in the latest tag's annotated message (engine=/
      # codegen=); for the one-time bootstrap off a pre-redesign tag (no such
      # lines) we read them from that tag's committed docker/Dockerfile ARG. No
      # source pin is written. "Latest" is semver precedence (v1.0.0 outranks
      # v1.0.0-rc.1; git's v:refname sort puts the rc first).
      - name: Resolve the landed (engine, codegen) pin pair
        id: pins
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          LATEST="$(git tag -l 'v*' | python3 scripts/release_pair.py latest-tag)"
          msg() { [ -n "$LATEST" ] && git for-each-ref --format='%(contents:body)' "refs/tags/$LATEST" | sed -n "s/^$1=//p" | head -1 || true; }
          # bootstrap: pre-redesign tags still carry the committed ARG pin.
          oldpin() { [ -n "$LATEST" ] && git show "$LATEST:docker/Dockerfile" 2>/dev/null | sed -n -E "s/^ARG $1=([0-9][^[:space:]]*)$/\1/p" | head -1 || true; }
          Eprev="$(msg engine)";  [ -n "$Eprev" ] || Eprev="$(oldpin ENGINE_VERSION)"
          Cprev="$(msg codegen)"; [ -n "$Cprev" ] || Cprev="$(oldpin CODEGEN_VERSION)"
          { echo "latest=$LATEST"; echo "eprev=$Eprev"; echo "cprev=$Cprev"; } >> "$GITHUB_OUTPUT"
          echo "landed at ${LATEST:-∅}: engine ${Eprev:-∅}, codegen ${Cprev:-∅}"

      # From 1.0.0 on a pair completes only once the OTHER component has
      # published the same version. Each upstream dispatches after its artifacts
      # are up (engine: release tarballs; codegen: PyPI), so the second event of
      # a pair always finds the first one's. Only that event can complete the
      # pair, so a probe that cannot tell (anything but 200 or 404) fails the run
      # (re-run it) instead of waiting. When the version is missing, the
      # partner's newest release tells a pending pair from a mismatched one.
      - name: Probe the partner release (1.0 line)
        id: partner
        if: steps.in.outputs.line == 'pair'
        env:
          COMPONENT: ${{ steps.in.outputs.component }}
          VER:       ${{ steps.in.outputs.version }}
          PYPI:      ${{ steps.in.outputs.pypi }}
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          http() {  # GET|HEAD URL -> final HTTP status (000 = no answer), transient errors retried
            local head=(); [ "$1" = HEAD ] && head=(-I)
            curl -sSL "${head[@]}" -o /dev/null -w '%{http_code}' --max-time 30 \
              --retry 4 --retry-delay 5 --retry-all-errors "$2" 2>/dev/null || true
          }
          if [ "$COMPONENT" = engine ]; then
            partner="codegen ${VER} (PyPI ${PYPI})"
            codes="$(http GET "https://pypi.org/pypi/pineforge-codegen/${PYPI}/json")"
          else
            partner="engine v${VER} tarballs"
            base="https://github.com/pineforge-4pass/pineforge-engine/releases/download/v${VER}"
            codes="$(http HEAD "${base}/pineforge-v${VER}-linux-x86_64.tar.gz") $(http HEAD "${base}/pineforge-v${VER}-linux-aarch64.tar.gz")"
          fi
          [ -n "${codes// /}" ] || { echo "::error::no HTTP status for ${partner}; re-run this job"; exit 1; }
          published=true
          for code in $codes; do
            case "$code" in
              200) ;;
              404) published=false ;;
              *) echo "::error::could not tell whether ${partner} is published (HTTP ${codes}); re-run this job"; exit 1 ;;
            esac
          done
          latest=""
          if [ "$published" = false ]; then
            if [ "$COMPONENT" = engine ]; then
              json="$(curl -fsSL --max-time 30 --retry 4 --retry-delay 5 --retry-all-errors https://pypi.org/pypi/pineforge-codegen/json)" \
                || { echo "::error::could not read codegen's releases from PyPI; re-run this job"; exit 1; }
              latest="$(printf '%s' "$json" | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["releases"]))' \
                | python3 scripts/release_pair.py latest-pep440)"
            else
              tags="$(gh api 'repos/pineforge-4pass/pineforge-engine/releases?per_page=100' -q '.[] | select(.draft | not) | .tag_name')" \
                || { echo "::error::could not read the engine's releases; re-run this job"; exit 1; }
              latest="$(printf '%s\n' "$tags" | python3 scripts/release_pair.py latest-tag)"
              latest="${latest#v}"
            fi
          fi
          { echo "published=$published"; echo "partner_latest=$latest"; } >> "$GITHUB_OUTPUT"
          echo "${partner} published: ${published}${latest:+ (its newest release: ${latest})}"

      - name: Decide action (pairing rule + idempotent + recover half-failed release + downgrade guard)
        id: decide
        env:
          COMPONENT: ${{ steps.in.outputs.component }}
          VER:       ${{ steps.in.outputs.version }}
          PAYLOAD_PRERELEASE: ${{ steps.in.outputs.payload_prerelease }}
          EPREV:     ${{ steps.pins.outputs.eprev }}
          CPREV:     ${{ steps.pins.outputs.cprev }}
          PUBLISHED: ${{ steps.partner.outputs.published }}
          PARTNER_LATEST: ${{ steps.partner.outputs.partner_latest }}
          FORCE:     ${{ github.event.client_payload.force }}
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < VERSION)"
          img="ghcr.io/pineforge-4pass/pineforge-release:${ver}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then image=true; else image=false; fi
          # Monotonicity (downgrade) guard on the DISPATCHED component, the 1.0
          # pairing rule, and noop / republish / bump / wait: see the script.
          echo "cur_ver=$ver" >> "$GITHUB_OUTPUT"
          python3 scripts/release_pair.py decide \
            --component="$COMPONENT" --version="$VER" --prerelease-flag="${PAYLOAD_PRERELEASE:-}" \
            --prev-engine="$EPREV" --prev-codegen="$CPREV" --current-release="$ver" \
            --other-published="${PUBLISHED:-false}" --image-exists="$image" --force="${FORCE:-}" \
            --partner-latest="${PARTNER_LATEST:-}" | tee -a "$GITHUB_OUTPUT"

      - name: No-op
        if: steps.decide.outputs.mode == 'noop'
        run: echo "engine+codegen unchanged and image exists — nothing to do."

      - name: Wait for the partner release (1.0 pair incomplete)
        if: steps.decide.outputs.mode == 'wait'
        env:
          COMPONENT: ${{ steps.in.outputs.component }}
          VER:       ${{ steps.in.outputs.version }}
          AWAITING:  ${{ steps.decide.outputs.awaiting }}
          EPREV:     ${{ steps.pins.outputs.eprev }}
          CPREV:     ${{ steps.pins.outputs.cprev }}
        run: |
          set -euo pipefail
          line="pair pending: ${COMPONENT} ${VER} recorded, waiting for ${AWAITING} ${VER}; the landed pair stays engine ${EPREV} + codegen ${CPREV} and nothing is built or published"
          echo "::notice title=pineforge pair pending::${line}"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-publish (recover a half-failed prior release)
        if: steps.decide.outputs.mode == 'republish'
        env:
          TAG: v${{ steps.decide.outputs.cur_ver }}
        run: |
          set -euo pipefail
          echo "versions unchanged but image missing — re-pushing ${TAG} to re-fire publish.yml"
          git push origin "refs/tags/${TAG}" --force

      - name: Bump VERSION, commit, tag (fires publish.yml)
        if: steps.decide.outputs.mode == 'bump'
        env:
          E:       ${{ steps.decide.outputs.engine }}
          C:       ${{ steps.decide.outputs.codegen }}
          LINE:    ${{ steps.decide.outputs.line }}
          RELEASE: ${{ steps.decide.outputs.release }}
          RETAG:   ${{ steps.decide.outputs.retag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if [ "$RETAG" = true ]; then
            # A pair release whose tag push failed: main already carries its
            # release commit (VERSION = the pair version). Tag that commit.
            commit="$(git log HEAD --format=%H -n 1 --fixed-strings --grep="chore(release): v${RELEASE} — engine ${E} + codegen ${C}")"
            [ -n "$commit" ] || { echo "::error::VERSION is ${RELEASE} but main has no release commit for it; refusing to tag"; exit 1; }
            git tag -a "v${RELEASE}" "$commit" -m "$(printf 'pineforge-release v%s\n\nengine=%s\ncodegen=%s\n' "$RELEASE" "$E" "$C")"
            git push origin "v${RELEASE}"
            echo "tagged v${RELEASE} at ${commit} (engine ${E} + codegen ${C}); publish.yml will build + fan out."
            exit 0
          fi
          if [ "$LINE" = pair ]; then
            # From 1.0.0 on the release version IS the pair version, prerelease included.
            next="$RELEASE"
            [ -n "$next" ] || { echo "::error::pair release without a version"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
              echo "::error::tag v${next} already exists without engine=${E} codegen=${C}; refusing to re-tag"; exit 1
            fi
          else
            # 0.x: patch-bump this repo's own version; skip any pre-existing tag.
            cur="$(tr -d '[:space:]' < VERSION)"
            [[ "$cur" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::VERSION malformed '$cur'"; exit 1; }
            maj="${BASH_REMATCH[1]}"; min="${BASH_REMATCH[2]}"; pat="${BASH_REMATCH[3]}"
            next="${maj}.${min}.$((pat + 1))"
            while git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; do
              pat=$((pat + 1)); next="${maj}.${min}.$((pat + 1))"
            done
          fi
          printf '%s\n' "$next" > VERSION
          # No source pin is written — the (engine, codegen) pair is recorded in the
          # IMMUTABLE annotated tag message (read back by publish.yml) + image labels.
          # Keep the harness in step with the pinned engine (its ABI mirrors the engine structs).
          curl -fsSL "https://raw.githubusercontent.com/pineforge-4pass/pineforge-engine/v${E}/docker/run_json.py" -o docker/run_json.py
          git add VERSION docker/run_json.py
          git diff --cached --quiet && { echo "::error::nothing staged — refusing empty release"; exit 1; }
          git commit -m "chore(release): v${next} — engine ${E} + codegen ${C}"
          git tag -a "v${next}" -m "$(printf 'pineforge-release v%s\n\nengine=%s\ncodegen=%s\n' "$next" "$E" "$C")"
          git push origin HEAD:main
          git push origin "v${next}"
          echo "pushed v${next} (engine ${E} + codegen ${C}); publish.yml will build + fan out."
