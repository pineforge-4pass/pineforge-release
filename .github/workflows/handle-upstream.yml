name: handle-upstream

# Inbound hub handler. Fired by an upstream release:
#   pineforge-engine      release.yml -> event_type=engine-release  {version: vX.Y.Z, prerelease, run_id}
#   pineforge-codegen-oss release.yml -> event_type=codegen-release {version: X.Y.Z, prerelease, run_id}
#   pineforge-hpo         release.yml -> event_type=hpo-release     {version: X.Y.Z, prerelease, run_id}
# `prerelease` (true|false) is optional and must agree with the version.
#
# 0.x line: moves the dispatched component's pin, freezes the other one,
# patch-bumps THIS repo's VERSION, commits + tags with the org GitHub App token.
# From 1.0.0 on (scripts/release_pair.py) engine and codegen share one version,
# prerelease included: the first event of a pair records its pin in the run
# log and builds nothing; the partner's event finds the first one's published
# artifacts, and the release version becomes the pair version.
# Hpo joins at the single cutoff in scripts/release_pair.py: then an event
# probes both partners and the tag records all three versions.
# The handler pushes the tag with the App token. Publication is a separate
# operator dispatch of publish.yml on main with that tag as input (build the
# combined image -> fan out to the MCPs and the app). Idempotent, with
# half-failed-release recovery, a downgrade guard, and serialized concurrency.

on:
  repository_dispatch:
    types: [engine-release, codegen-release, hpo-release]

concurrency:
  group: handle-upstream
  cancel-in-progress: false

permissions:
  contents: read   # the App token does the push
  issues: write    # neutral failure incidents only

jobs:
  bump:
    # owner 10-21 (msg 1562390657274748981): pineforge-release runs on GitHub-hosted runners; R6/rule-B exception for this repo
    runs-on: ubuntu-latest
    environment: release-automation
    steps:
      - name: Mint org App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pineforge-release
          permission-contents: write
          github-api-url: https://api.github.com

      - name: Checkout main (App token bypasses the ruleset)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Validate payload
        id: in
        env:
          EVENT: ${{ github.event.action }}
          RAW_VERSION: ${{ github.event.client_payload.version }}
          RAW_PRERELEASE: ${{ github.event.client_payload.prerelease }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          set -euo pipefail
          # client_payload is ATTACKER-CONTROLLABLE -> strict allowlist before it
          # reaches a build-arg / pip pin / image ref / tag message.
          case "$EVENT" in
            engine-release)  component=engine ;;
            codegen-release) component=codegen ;;
            hpo-release)     component=hpo ;;
            *) echo "::error::unexpected event '$EVENT'"; exit 1 ;;
          esac
          if [ "$component" = hpo ]; then
            if ! [[ "${RAW_VERSION:-}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+|(a|b|rc)[0-9]+)?$ ]]; then
              echo "::error::rejected untrusted version '${RAW_VERSION:-}'"; exit 1
            fi
          else
            if ! printf '%s' "${RAW_VERSION:-}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$'; then
              echo "::error::rejected untrusted version '${RAW_VERSION:-}'"; exit 1
            fi
          fi
          case "${RAW_PRERELEASE:-}" in
            ''|true|false) ;;
            *) echo "::error::rejected untrusted prerelease '${RAW_PRERELEASE}'"; exit 1 ;;
          esac
          # Whole-value match: grep would accept a multi-line value line by line.
          if [ -n "${RUN_ID:-}" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::bad run_id"; exit 1
          fi
          # The release rules keep engine/codegen semver-only and normalize
          # either hpo spelling. The emitted bare version is always semver;
          # hpo_pep440 supplies the wheel's version without workflow conversion.
          facts="$(python3 scripts/release_pair.py info "$RAW_VERSION" --component="$component")"
          VER="$(printf '%s\n' "$facts" | sed -n 's/^bare=//p')"
          {
            echo "component=$component"
            echo "version=$VER"
            echo "payload_prerelease=${RAW_PRERELEASE:-}"
            printf '%s\n' "$facts"
          } >> "$GITHUB_OUTPUT"
          echo "dispatched ${component}=${VER} (event ${EVENT}, prerelease ${RAW_PRERELEASE:-unset}, upstream run ${RUN_ID:-n/a})"

      - name: Validate producer event JSON types
        run: |
          python3 - <<'PYEVENT'
          import json, os
          e = json.load(open(os.environ['GITHUB_EVENT_PATH']))['client_payload']
          if type(e.get('version')) is not str:
              raise SystemExit('version must be a JSON string')
          if 'prerelease' in e and type(e['prerelease']) is not bool:
              raise SystemExit('prerelease must be a JSON boolean')
          if 'run_id' in e and (type(e['run_id']) is not int or e['run_id'] <= 0):
              raise SystemExit('run_id must be a positive JSON integer')
          PYEVENT

      - name: Verify the dispatched producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ steps.in.outputs.component }}
          VER: ${{ steps.in.outputs.version }}
        run: python3 scripts/release_pipeline.py producer "$COMPONENT" "$VER"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Log in to GHCR (read, for the image-exists probe)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The landed pins live in the latest tag's annotated message (engine=/
      # codegen=/hpo=); for the one-time bootstrap off a pre-redesign tag (no such
      # lines) we read them from that tag's committed docker/Dockerfile ARG. No
      # source pin is written. "Latest" is semver precedence (v1.0.0 outranks
      # v1.0.0-rc.1; git's v:refname sort puts the rc first).
      - name: Resolve the landed component pins
        id: pins
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          LATEST="$(git tag -l 'v*' | python3 scripts/release_pair.py latest-tag)"
          msg() { [ -n "$LATEST" ] && git for-each-ref --format='%(contents:body)' "refs/tags/$LATEST" | sed -n "s/^$1=//p" | head -1 || true; }
          # bootstrap: pre-redesign tags still carry the committed ARG pin.
          oldpin() { [ -n "$LATEST" ] && git show "$LATEST:docker/Dockerfile" 2>/dev/null | sed -n -E "s/^ARG $1=([0-9][^[:space:]]*)$/\1/p" | head -1 || true; }
          Eprev="$(msg engine)";  [ -n "$Eprev" ] || Eprev="$(oldpin ENGINE_VERSION)"
          Cprev="$(msg codegen)"; [ -n "$Cprev" ] || Cprev="$(oldpin CODEGEN_VERSION)"
          Hprev=""
          if [ -n "$LATEST" ] && python3 scripts/release_pair.py info "$LATEST" | grep -q '^hpo_pairing=true$'; then
            Hprev="$(msg hpo)"
            python3 scripts/release_pair.py check --release="${LATEST#v}" --engine="$Eprev" --codegen="$Cprev" --hpo="$Hprev" >/dev/null
          fi
          { echo "latest=$LATEST"; echo "eprev=$Eprev"; echo "cprev=$Cprev"; echo "hprev=$Hprev"; } >> "$GITHUB_OUTPUT"
          echo "landed at ${LATEST:-∅}: engine ${Eprev:-∅}, codegen ${Cprev:-∅}${Hprev:+, hpo ${Hprev}}"

      # From 1.0.0 on a pair completes only once the OTHER component has
      # published the same version. Each upstream dispatches after its artifacts
      # are up (engine: release tarballs; codegen: PyPI), so the second event of
      # a pair always finds the first one's. Only that event can complete the
      # pair, so a probe that cannot tell (anything but 200 or 404) fails the run
      # (re-run it) instead of waiting. When the version is missing, the
      # partner's newest release tells a pending pair from a mismatched one.
      - name: Probe the partner releases (pairing line)
        id: partner
        if: steps.in.outputs.line == 'pair'
        env:
          COMPONENT: ${{ steps.in.outputs.component }}
          VER:       ${{ steps.in.outputs.version }}
          PYPI:      ${{ steps.in.outputs.pypi }}
          HPO_PAIRING: ${{ steps.in.outputs.hpo_pairing }}
          HPO_VERSION: ${{ steps.in.outputs.hpo_pep440 }}
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          http() {  # GET|HEAD URL -> final HTTP status (000 = no answer), transient errors retried
            local head=(); [ "$1" = HEAD ] && head=(-I)
            curl -sSL "${head[@]}" -o /dev/null -w '%{http_code}' --max-time 30 \
              --retry 4 --retry-delay 5 --retry-all-errors "$2" 2>/dev/null || true
          }
          partners="engine codegen"
          [ "${HPO_PAIRING:-}" != true ] || partners="engine codegen hpo"
          for kind in $partners; do
            [ "$kind" != "$COMPONENT" ] || continue
            case "$kind" in
              codegen)
                partner="codegen ${VER} (PyPI ${PYPI})"
                codes="$(http GET "https://pypi.org/pypi/pineforge-codegen/${PYPI}/json")" ;;
              engine)
                partner="engine v${VER} tarballs"
                base="https://github.com/pineforge-4pass/pineforge-engine/releases/download/v${VER}"
                codes="$(http HEAD "${base}/pineforge-v${VER}-linux-x86_64.tar.gz") $(http HEAD "${base}/pineforge-v${VER}-linux-aarch64.tar.gz")" ;;
              hpo)
                partner="hpo ${HPO_VERSION} wheel"
                base="https://github.com/pineforge-4pass/pineforge-hpo/releases/download/v${HPO_VERSION}"
                codes="$(http HEAD "${base}/pineforge_hpo-${HPO_VERSION}-py3-none-any.whl")" ;;
              *) echo "::error::unexpected partner '$kind'"; exit 1 ;;
            esac
            [ -n "${codes// /}" ] || { echo "::error::no HTTP status for ${partner}; re-run this job"; exit 1; }
            published=true
            for code in $codes; do
              case "$code" in
                200) ;;
                404) published=false ;;
                *) echo "::error::could not tell whether ${partner} is published (HTTP ${codes}); re-run this job"; exit 1 ;;
              esac
            done
            latest=""
            if [ "$published" = false ]; then
              if [ "$kind" = codegen ]; then
                json="$(curl -fsSL --max-time 30 --retry 4 --retry-delay 5 --retry-all-errors https://pypi.org/pypi/pineforge-codegen/json)" \
                  || { echo "::error::could not read codegen's releases from PyPI; re-run this job"; exit 1; }
                latest="$(printf '%s' "$json" | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["releases"]))' \
                  | python3 scripts/release_pair.py latest-pep440)"
              else
                case "$kind" in
                  engine) endpoint='repos/pineforge-4pass/pineforge-engine/releases?per_page=100' ;;
                  hpo) endpoint='repos/pineforge-4pass/pineforge-hpo/releases?per_page=100' ;;
                esac
                tags="$(gh api "$endpoint" -q '.[] | select(.draft | not) | .tag_name')" \
                  || { echo "::error::could not read ${kind}'s releases; re-run this job"; exit 1; }
                if [ "$kind" = hpo ]; then
                  # Drafts alone are filtered above: hpo rc wheels are GitHub
                  # prereleases, so they must participate in newest-version checks.
                  latest="$(printf '%s\n' "$tags" | python3 scripts/release_pair.py latest-pep440 --tags)"
                else
                  latest="$(printf '%s\n' "$tags" | python3 scripts/release_pair.py latest-tag)"
                  latest="${latest#v}"
                fi
              fi
            fi
            { echo "${kind}_published=$published"; echo "${kind}_latest=$latest"; } >> "$GITHUB_OUTPUT"
            if [ "$COMPONENT" != hpo ] && [ "$kind" != hpo ]; then
              { echo "published=$published"; echo "partner_latest=$latest"; } >> "$GITHUB_OUTPUT"
            fi
            echo "${partner} published: ${published}${latest:+ (its newest release: ${latest})}"
          done

      - name: Decide action (pairing rule + idempotent + recover half-failed release + downgrade guard)
        id: decide
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}  # must be able to list hub drafts
          COMPONENT: ${{ steps.in.outputs.component }}
          VER:       ${{ steps.in.outputs.version }}
          PAYLOAD_PRERELEASE: ${{ steps.in.outputs.payload_prerelease }}
          EPREV:     ${{ steps.pins.outputs.eprev }}
          CPREV:     ${{ steps.pins.outputs.cprev }}
          HPREV:     ${{ steps.pins.outputs.hprev }}
          HPO_PAIRING: ${{ steps.in.outputs.hpo_pairing }}
          PUBLISHED: ${{ steps.partner.outputs.published }}
          PARTNER_LATEST: ${{ steps.partner.outputs.partner_latest }}
          ENGINE_PUBLISHED: ${{ steps.partner.outputs.engine_published }}
          CODEGEN_PUBLISHED: ${{ steps.partner.outputs.codegen_published }}
          HPO_PUBLISHED: ${{ steps.partner.outputs.hpo_published }}
          ENGINE_LATEST: ${{ steps.partner.outputs.engine_latest }}
          CODEGEN_LATEST: ${{ steps.partner.outputs.codegen_latest }}
          HPO_LATEST: ${{ steps.partner.outputs.hpo_latest }}
          # Preserve the existing 0.x forced downgrade; no other event reads force.
          FORCE: ${{ steps.in.outputs.line == 'legacy' && steps.in.outputs.component != 'hpo' && github.event.client_payload.force || '' }}
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < VERSION)"
          # gh refuses --slurp together with --jq, so jq reads the slurped pages.
          candidate="$(gh api --paginate --slurp repos/pineforge-4pass/pineforge-release/releases \
            | jq -r --arg tag "v${ver}" 'any(.[][]; .tag_name == $tag and any(.assets[]; .name == "release-candidate.json"))')"
          img="ghcr.io/pineforge-4pass/pineforge-release:${ver}"
          image=false
          if [ "$candidate" != true ] && docker manifest inspect "$img" >/dev/null 2>&1; then image=true; fi
          # Monotonicity (downgrade) guard on the DISPATCHED component, the 1.0
          # pairing rule, and noop / republish / bump / wait: see the script.
          echo "cur_ver=$ver" >> "$GITHUB_OUTPUT"
          partners=()
          if [ "${HPO_PAIRING:-}" = true ]; then
            partners=(--engine-published="${ENGINE_PUBLISHED:-false}" --codegen-published="${CODEGEN_PUBLISHED:-false}" --hpo-published="${HPO_PUBLISHED:-false}"
                      --engine-latest="${ENGINE_LATEST:-}" --codegen-latest="${CODEGEN_LATEST:-}" --hpo-latest="${HPO_LATEST:-}")
          fi
          python3 scripts/release_pair.py decide \
            --component="$COMPONENT" --version="$VER" --prerelease-flag="${PAYLOAD_PRERELEASE:-}" \
            --prev-engine="$EPREV" --prev-codegen="$CPREV" --current-release="$ver" \
            --other-published="${PUBLISHED:-false}" --image-exists="$image" --candidate-exists="$candidate" --force="${FORCE:-}" \
            --partner-latest="${PARTNER_LATEST:-}" --prev-hpo="${HPREV:-}" "${partners[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: No-op
        if: steps.decide.outputs.mode == 'noop'
        run: echo "Component pins unchanged; image or verified candidate already exists."

      - name: Wait for the partner release (1.0 pair incomplete)
        if: steps.decide.outputs.mode == 'wait'
        env:
          COMPONENT: ${{ steps.in.outputs.component }}
          VER:       ${{ steps.in.outputs.version }}
          AWAITING:  ${{ steps.decide.outputs.awaiting }}
          HPO_VERSION: ${{ steps.in.outputs.hpo_pep440 }}
          EPREV:     ${{ steps.pins.outputs.eprev }}
          CPREV:     ${{ steps.pins.outputs.cprev }}
          HPREV:     ${{ steps.pins.outputs.hprev }}
        run: |
          set -euo pipefail
          waiting=""
          IFS=, read -r -a partners <<< "$AWAITING"
          for partner in "${partners[@]}"; do
            partner_version="$VER"
            [ "$partner" != hpo ] || partner_version="$HPO_VERSION"
            waiting="${waiting:+${waiting} + }${partner} ${partner_version}"
          done
          event_version="$VER"
          [ "$COMPONENT" != hpo ] || event_version="$HPO_VERSION"
          line="pair pending: ${COMPONENT} ${event_version} recorded, waiting for ${waiting}; the landed pair stays engine ${EPREV} + codegen ${CPREV}${HPREV:+ + hpo ${HPREV}} and nothing is built or published"
          echo "::notice title=pineforge pair pending::${line}"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-publish (recover a half-failed prior release)
        if: steps.decide.outputs.mode == 'republish'
        env:
          TAG: v${{ steps.decide.outputs.cur_ver }}
        run: |
          set -euo pipefail
          line="versions unchanged but image missing for ${TAG}; after the tag exists on main and handle-upstream is green, a user with write access must run: gh workflow run publish.yml --repo pineforge-4pass/pineforge-release --ref main -f tag=${TAG}"
          echo "::warning title=pineforge publish needed::${line}"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Bump VERSION, commit, tag
        if: steps.decide.outputs.mode == 'bump'
        env:
          E:       ${{ steps.decide.outputs.engine }}
          C:       ${{ steps.decide.outputs.codegen }}
          H:       ${{ steps.decide.outputs.hpo }}
          LINE:    ${{ steps.decide.outputs.line }}
          RELEASE: ${{ steps.decide.outputs.release }}
          RETAG:   ${{ steps.decide.outputs.retag }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          components="engine ${E} + codegen ${C}${H:+ + hpo ${H}}"
          tag_message() {
            printf 'pineforge-release v%s\n\nengine=%s\ncodegen=%s\n' "$1" "$E" "$C"
            if [ -n "$H" ]; then printf 'hpo=%s\n' "$H"; fi
          }
          if [ "$RETAG" = true ]; then
            # A pair release whose tag push failed: main already carries its
            # release commit (VERSION = the pair version). Tag that commit.
            commit="$(git log HEAD --format=%H -n 1 --fixed-strings --grep="chore(release): v${RELEASE} — ${components}")"
            [ -n "$commit" ] || { echo "::error::VERSION is ${RELEASE} but main has no release commit for it; refusing to tag"; exit 1; }
            git tag -a "v${RELEASE}" "$commit" -m "$(tag_message "$RELEASE")"
            git push origin "v${RELEASE}"
            line="pushed v${RELEASE} at ${commit} (${components}); after the tag exists on main and handle-upstream is green, a user with write access must run: gh workflow run publish.yml --repo pineforge-4pass/pineforge-release --ref main -f tag=v${RELEASE}"
            echo "::notice title=pineforge publish needed::${line}"
            printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$LINE" = pair ]; then
            # From 1.0.0 on the release version IS the pair version, prerelease included.
            next="$RELEASE"
            [ -n "$next" ] || { echo "::error::pair release without a version"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
              echo "::error::tag v${next} already exists without engine=${E} codegen=${C}${H:+ hpo=${H}}; refusing to re-tag"; exit 1
            fi
          else
            # 0.x: patch-bump this repo's own version; skip any pre-existing tag.
            cur="$(tr -d '[:space:]' < VERSION)"
            [[ "$cur" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::VERSION malformed '$cur'"; exit 1; }
            maj="${BASH_REMATCH[1]}"; min="${BASH_REMATCH[2]}"; pat="${BASH_REMATCH[3]}"
            next="${maj}.${min}.$((pat + 1))"
            while git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; do
              pat=$((pat + 1)); next="${maj}.${min}.$((pat + 1))"
            done
          fi
          printf '%s\n' "$next" > VERSION
          # No source pin is written — the component pins are recorded in the
          # IMMUTABLE annotated tag message (read back by publish.yml) + image labels.
          # Keep the harness in step with the pinned engine tag v${E}: the engine's runtime files
          # (run_json.py mirrors the engine structs; the entrypoint and every module they run) and
          # the sums file the image build checks them against. scripts/sync-harness.sh holds the
          # one list of the files; the pinned tag is always the source (the script's ref override
          # is not used here).
          bash scripts/sync-harness.sh "${E}"
          harness="$(bash scripts/sync-harness.sh --files)"
          # shellcheck disable=SC2086  # trusted sync-harness --files manifest
          git add VERSION ${harness}
          git diff --cached --quiet && { echo "::error::nothing staged — refusing empty release"; exit 1; }
          git commit -m "chore(release): v${next} — ${components}"
          git tag -a "v${next}" -m "$(tag_message "$next")"
          git push origin HEAD:main
          git push origin "v${next}"
          line="pushed v${next} (${components}); after the tag exists on main and handle-upstream is green, a user with write access must run: gh workflow run publish.yml --repo pineforge-4pass/pineforge-release --ref main -f tag=v${next}"
          echo "::notice title=pineforge publish needed::${line}"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed upstream handling
        if: ${{ failure() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
        run: python3 scripts/release_pipeline.py alert --stage producer
