name: repository-description-drift

on:
  push:
    branches: [main]
    paths:
      - facts/facts.json
      - facts/facts.schema.json
      - facts/repo-descriptions.json
      - scripts/repo_descriptions.py
      - .github/workflows/repo-description-drift.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render exact proposed descriptions and review-only commands
        run: |
          mkdir -p description-proposals
          python3 scripts/repo_descriptions.py render --facts facts/facts.json > description-proposals/descriptions.json
          python3 scripts/repo_descriptions.py render --facts facts/facts.json --format commands > description-proposals/apply-commands.txt
      - name: Check live public descriptions without applying changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repo_descriptions.py check --facts facts/facts.json --live > description-proposals/live-check.json
      - name: Preserve exact proposals and live deltas even on drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-description-proposals
          path: description-proposals/
          if-no-files-found: error
