name: Mirror build proof (throwaway)

# Throwaway hosted-run proof, never merged: it runs only on its own branch and
# on manual dispatch. On a GitHub-hosted runner it shows that every image the
# mirror change in publish.yml names is served by mirror.gcr.io as a multi-arch
# index with linux/amd64 and linux/arm64, and that the multi-arch build of
# docker/Dockerfile succeeds with the same QEMU and Buildx set-up steps as the
# publish job. It pushes no image, logs in to no registry and uses no secret.

on:
  push:
    branches: [sm/h02-build-proof-20261010]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        id: checkout
        uses: actions/checkout@v4

      # The three images the change names: the emulation image, the BuildKit
      # image, and the one base image in docker/Dockerfile (all three of its
      # stages start FROM debian:bookworm-slim, which BuildKit asks the mirror
      # for as library/debian).
      - name: Mirror serves every named image
        id: mirror
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import re
          import subprocess
          import sys

          IMAGES = [
              "mirror.gcr.io/tonistiigi/binfmt:latest",
              "mirror.gcr.io/moby/buildkit:buildx-stable-1",
              "mirror.gcr.io/library/debian:bookworm-slim",
          ]
          INDEX_TYPES = (
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          )
          NEEDED = ("linux/amd64", "linux/arm64")

          problems = []
          for ref in IMAGES:
              print("::group::" + ref)
              result = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", ref],
                  capture_output=True,
                  text=True,
                  timeout=180,
              )
              print(result.stdout, end="")
              print(result.stderr, end="")
              print("::endgroup::")
              if result.returncode != 0:
                  problems.append(ref + ": the manifest read failed, exit " + str(result.returncode))
                  continue
              media = re.search(r"^MediaType:[ \t]*(\S+)", result.stdout, re.M)
              digest = re.search(r"^Digest:[ \t]*(\S+)", result.stdout, re.M)
              if media is None or digest is None:
                  problems.append(ref + ": no media type or digest in the manifest read")
                  continue
              platforms = re.findall(r"^[ \t]+Platform:[ \t]*(\S+)", result.stdout, re.M)
              # A platform can carry a variant (linux/arm64/v8): compare os/architecture.
              have = set("/".join(p.split("/")[:2]) for p in platforms)
              missing = [p for p in NEEDED if p not in have]
              is_index = media.group(1) in INDEX_TYPES
              print(ref)
              print("  media type:       " + media.group(1))
              print("  digest:           " + digest.group(1))
              print("  multi-arch index: " + ("yes" if is_index else "no"))
              print("  linux/amd64 and linux/arm64: " + ("both present" if not missing else "missing " + " ".join(missing)))
              if not is_index:
                  problems.append(ref + ": not an index, media type " + media.group(1))
              elif missing:
                  problems.append(ref + ": the index lacks " + " ".join(missing))

          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("The mirror serves every named image as a multi-arch index with linux/amd64 and linux/arm64.")
          PY

      - name: Workflow form equals publish.yml
        id: form
        run: |
          set -euo pipefail
          if ! python3 -c 'import yaml'; then
            sudo apt-get update
            sudo apt-get install --yes python3-yaml
          fi
          python3 -u - <<'PY'
          import sys

          import yaml

          PUBLISH = ".github/workflows/publish.yml"
          PROOF = ".github/workflows/h02-build-proof.yml"
          # Each action, with the inputs the mirror change sets on it.
          ACTIONS = (
              ("docker/setup-qemu-action", ("image",)),
              ("docker/setup-buildx-action", ("driver-opts", "buildkitd-config-inline")),
          )


          def steps_using(path, action):
              with open(path, encoding="utf-8") as handle:
                  workflow = yaml.safe_load(handle)
              found = []
              for job in workflow["jobs"].values():
                  for step in job.get("steps") or []:
                      if str(step.get("uses", "")).split("@", 1)[0] == action:
                          found.append(step)
              return found


          problems = []
          for action, keys in ACTIONS:
              in_publish = steps_using(PUBLISH, action)
              in_proof = steps_using(PROOF, action)
              print(action + ": " + str(len(in_publish)) + " step in publish.yml, " + str(len(in_proof)) + " here")
              if len(in_publish) != 1 or len(in_proof) != 1:
                  problems.append(action + ": expected exactly one step in each file")
                  continue
              publish_step = in_publish[0]
              proof_step = in_proof[0]
              publish_with = publish_step.get("with") or {}
              proof_with = proof_step.get("with") or {}
              print("  publish.yml: " + publish_step["uses"] + " " + repr(publish_with))
              print("  this file:   " + proof_step["uses"] + " " + repr(proof_with))
              absent = [key for key in keys if key not in publish_with]
              if absent:
                  problems.append(action + ": publish.yml sets no " + ", ".join(absent))
              if publish_step["uses"] != proof_step["uses"]:
                  problems.append(action + ": the version pin differs from publish.yml")
              if publish_with != proof_with:
                  problems.append(action + ": the with mapping differs from publish.yml")

          if problems:
              for problem in problems:
                  print("::error::" + problem)
              sys.exit(1)
          print("The QEMU and Buildx set-up steps match publish.yml.")
          PY

      - uses: docker/setup-qemu-action@v3
        with:
          # The emulation image comes from a public mirror of Docker Hub
          # (mirror.gcr.io), not from Docker Hub itself.
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@v3
        with:
          # Same for the BuildKit image ...
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # ... and BuildKit asks the mirror first for every Docker Hub name it
          # resolves: the base images in docker/Dockerfile and any `# syntax=`
          # frontend.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Multi-arch build (nothing is pushed)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            ENGINE_VERSION=1.4.0
            CODEGEN_VERSION=1.4.0

      - name: Summary of earlier steps
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
          FORM_OUTCOME: ${{ steps.form.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          # The two set-up steps are copied from publish.yml without a step id, so
          # their result is read from the steps around them: the build runs only
          # when both passed.
          case "${BUILD_OUTCOME:-}" in
            success|failure)
              setup=success
              ;;
            *)
              if [ "${CHECKOUT_OUTCOME:-}" = success ] && [ "${MIRROR_OUTCOME:-}" = success ] && [ "${FORM_OUTCOME:-}" = success ]; then
                setup=failed-or-cancelled
              else
                setup=not-run
              fi
              ;;
          esac
          echo "Proof summary: checkout=${CHECKOUT_OUTCOME:-not-run} mirror=${MIRROR_OUTCOME:-not-run} workflow-form=${FORM_OUTCOME:-not-run} qemu-and-buildx-setup=${setup} build=${BUILD_OUTCOME:-not-run}"
