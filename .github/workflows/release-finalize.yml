name: release-finalize

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag, or empty to reconcile all candidates
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['facts/facts.json']
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: read

jobs:
  finalize:
    # Job-level concurrency also applies when invoked through workflow_call.
    # Serialize alias decisions and persistent delivery reservations together.
    concurrency:
      group: release-finalize
      cancel-in-progress: false
    runs-on: ["self-hosted","pf-ci","pf-ci-release"]
    environment: release-automation
    permissions:
      contents: write
      packages: write
      issues: write
    outputs:
      deliveries: ${{ steps.ready.outputs.deliveries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r facts/requirements-validation.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Finalize or record missing prerequisites
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_READY_CONSUMERS: ${{ vars.RELEASE_READY_CONSUMERS }}
          FACTS_WEB_DISPATCH_ENABLED: ${{ vars.FACTS_WEB_DISPATCH_ENABLED }}
          FACTS_LICENSE_DISPATCH_ENABLED: ${{ vars.FACTS_LICENSE_DISPATCH_ENABLED }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
          RELEASE_READY_MAX_AGE_MINUTES: ${{ vars.RELEASE_READY_MAX_AGE_MINUTES || '60' }}
          RELEASE_CONSUMER_MAX_AGE_MINUTES: ${{ vars.RELEASE_CONSUMER_MAX_AGE_MINUTES || '180' }}
          RELEASE_APPLICATION_MAX_AGE_MINUTES: ${{ vars.RELEASE_APPLICATION_MAX_AGE_MINUTES || '1440' }}
        run: |
          set -euo pipefail
          python3 scripts/release_pipeline.py finalize --tag "$TAG" --output "$RUNNER_TEMP/deliveries.json"
          echo "deliveries=$(cat "$RUNNER_TEMP/deliveries.json")" >> "$GITHUB_OUTPUT"
      - name: Report finalizer failure
        if: ${{ failure() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
        run: python3 scripts/release_pipeline.py alert --stage finalize

  notify-consumers:
    needs: finalize
    if: needs.finalize.outputs.deliveries != '[]'
    runs-on: ["self-hosted","pf-ci","pf-ci-release"]
    environment: release-automation
    concurrency:
      group: release-delivery-${{ matrix.consumer }}-${{ matrix.tag }}
      cancel-in-progress: false
    permissions:
      contents: write  # append neutral delivery audit assets in this hub only
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.finalize.outputs.deliveries) }}
    env:
      # Private targets never enter matrix outputs, log messages or public receipts.
      TARGET_REPOSITORY: ${{ matrix.consumer == 'offline' && 'pineforge-backtest-mcp' || matrix.consumer == 'hosted' && secrets.RELEASE_HOSTED_MCP_REPOSITORY || matrix.consumer == 'application' && secrets.RELEASE_APPLICATION_REPOSITORY || matrix.consumer == 'web' && secrets.FACTS_WEB_REPOSITORY || matrix.consumer == 'data' && 'pineforge-data' || matrix.consumer == 'license' && 'pineforge-license' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require one configured consumer repository
        shell: bash
        run: |
          if ! [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo '::error::Missing or malformed consumer repository setup'; exit 1
          fi
      - name: Mint App token (scoped to one target)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.TARGET_REPOSITORY }}
          permission-contents: write
          github-api-url: https://api.github.com
      - name: Dispatch pineforge-release from immutable bytes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ matrix.tag }}
          CONSUMER: ${{ matrix.consumer }}
          DELIVERY_ATTEMPT: ${{ matrix.attempt }}
        run: |
          python3 scripts/release_pipeline.py dispatch --tag "$TAG" --consumer "$CONSUMER" \
            --attempt "$DELIVERY_ATTEMPT" --output "$RUNNER_TEMP/delivery.json"
      - name: Preserve delivery receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          CONSUMER: ${{ matrix.consumer }}
        run: |
          python3 scripts/release_receipts.py delivery --tag "$TAG" --consumer "$CONSUMER" \
            --file "$RUNNER_TEMP/delivery.json"
      - name: Preserve this delivery attempt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-delivery-${{ matrix.consumer }}-${{ matrix.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery.json
          if-no-files-found: warn
      - name: Report failed dispatch
        if: ${{ failure() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
        run: python3 scripts/release_pipeline.py alert --stage dispatch
