name: publish

# Build + push the combined pineforge-release image, then fan out to the MCPs
# and the app. Fires on the v* tag that handle-upstream.yml pushes with the App
# token (or a manual tag). The tag value equals VERSION (asserted below).
# From 1.0.0 on the image pairs engine and codegen at the release version
# (scripts/release_pair.py check). A prerelease tag (vX.Y.Z-rc.N) is published
# as a GitHub prerelease with the fixed tags X.Y.Z-rc.N, engine<E>-codegen<C>
# and sha-<short> only, and sends `prerelease: true` downstream; `latest` and
# the moving `X.Y` follow the newest stable release only.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}   # pineforge-4pass/pineforge-release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: write   # gh release create
      packages: write   # push to GHCR
    outputs:
      prerelease: ${{ steps.pair.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="$(tr -d '[:space:]' < VERSION)"
          [ "${TAG#v}" = "$file" ] || { echo "::error::tag ${TAG} != VERSION ${file}"; exit 1; }

      - name: Read pins (from the annotated tag message; fallback = the pair version, or resolve latest on 0.x)
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver() { printf '%s' "$1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$'; }
          # actions/checkout@v4 re-points refs/tags/<tag> at the COMMIT it peels to,
          # so cat-file would see 'commit' and we'd never read the annotated message.
          # Re-fetch tags (forced) to restore the annotated tag objects.
          git fetch --force --tags origin >/dev/null 2>&1 || true
          e=""; c=""
          # Trust the tag message ONLY if REF is an ANNOTATED tag — a lightweight
          # tag's %(contents:body) leaks the target commit body, not our keys.
          if [ "$(git cat-file -t "$REF" 2>/dev/null || true)" = tag ]; then
            e="$(git for-each-ref --format='%(contents:body)' "refs/tags/$REF" | sed -n 's/^engine=//p'  | head -1)"
            c="$(git for-each-ref --format='%(contents:body)' "refs/tags/$REF" | sed -n 's/^codegen=//p' | head -1)"
          fi
          if ! semver "$e" || ! semver "$c"; then
            line="$(python3 scripts/release_pair.py info "$REF" | sed -n 's/^line=//p')"
            if [ "$line" = pair ]; then
              # From 1.0.0 on the release version IS the pair version.
              echo "::warning::tag ${REF} lacks valid engine=/codegen= in its message — using the pair version ${REF#v}"
              e="${REF#v}"; c="${REF#v}"
            else
              echo "::warning::tag ${REF} lacks valid engine=/codegen= in its message — resolving latest (manual-tag path)"
              for i in 1 2 3 4 5; do e="$(gh release view -R pineforge-4pass/pineforge-engine --json tagName -q .tagName 2>/dev/null || true)"; [ -n "$e" ] && break; sleep 5; done
              e="${e#v}"
              for i in 1 2 3 4 5; do c="$(curl -fsSL https://pypi.org/pypi/pineforge-codegen/json 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || true)"; [ -n "$c" ] && break; sleep 5; done
            fi
          fi
          semver "$e" || { echo "::error::bad engine version '$e'"; exit 1; }
          semver "$c" || { echo "::error::bad codegen version '$c'"; exit 1; }
          { echo "engine=$e"; echo "codegen=$c"; } >> "$GITHUB_OUTPUT"
          echo "pins: engine=$e codegen=$c"

      # From 1.0.0 on engine and codegen share one version, prerelease included,
      # and the release version is that version: a mismatched pair fails here
      # naming both, before anything is built. The 0.x line keeps independent
      # pins and is stable-only. Emits line, prerelease, codegen_pypi, and
      # moving (a stable release that is the newest stable tag when this run
      # starts: re-running an older release never moves `latest` / X.Y back;
      # two publish runs that overlap can still finish out of order).
      - name: Pairing rule + release channel
        id: pair
        env:
          REF: ${{ github.ref_name }}
          E: ${{ steps.pins.outputs.engine }}
          C: ${{ steps.pins.outputs.codegen }}
        run: |
          set -euo pipefail
          newest="$(git tag -l 'v*' | python3 scripts/release_pair.py latest-tag --stable)"
          python3 scripts/release_pair.py check --release="${REF#v}" --engine="$E" --codegen="$C" \
            --newest-stable="$newest" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for upstream artifacts (engine tarballs + codegen on PyPI)
        env:
          E: ${{ steps.pins.outputs.engine }}
          C: ${{ steps.pins.outputs.codegen }}
          CP: ${{ steps.pair.outputs.codegen_pypi }}
        run: |
          set -euo pipefail
          # The Dockerfile builds FROM the engine static-lib tarball (per arch),
          # not a Docker image. Confirm both arch tarballs + the codegen version
          # are published before building (the build fetch fails loud anyway).
          # PyPI spells a codegen prerelease the PEP 440 way (1.0.0rc1); pip
          # reads the Dockerfile's ==1.0.0-rc.1 pin as that same version.
          base="https://github.com/pineforge-4pass/pineforge-engine/releases/download/v${E}"
          ok=
          for i in $(seq 1 20); do
            if curl -fsIL "${base}/pineforge-v${E}-linux-x86_64.tar.gz"  >/dev/null 2>&1 \
               && curl -fsIL "${base}/pineforge-v${E}-linux-aarch64.tar.gz" >/dev/null 2>&1 \
               && curl -fsSL "https://pypi.org/pypi/pineforge-codegen/${CP}/json" >/dev/null 2>&1; then
              ok=1; break
            fi
            echo "waiting for engine ${E} tarballs + codegen ${C} (PyPI ${CP}) ... (${i})"
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::engine ${E} tarballs or codegen ${C} not available after wait"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # `latest` and the moving X.Y only for the newest stable release (never
          # a prerelease). The action's own automatic `latest` is off; the raw
          # one below is the only source.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ steps.pair.outputs.moving == 'true' }}
            type=raw,value=latest,enable=${{ steps.pair.outputs.moving == 'true' }}
            type=raw,value=engine${{ steps.pins.outputs.engine }}-codegen${{ steps.pins.outputs.codegen }}
            type=sha,format=short
          # The action derives the licences label from this repository's
          # Apache-2.0, and its labels override the Dockerfile's. The image also
          # bundles the transpiler, whose LICENSE from codegen 1.3.0 is the
          # PineForge Source License 1.2 (see README, License).
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND LicenseRef-PineForge-Source-License-1.2

      - name: Build + push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_VERSION=${{ steps.pins.outputs.engine }}
            CODEGEN_VERSION=${{ steps.pins.outputs.codegen }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          E: ${{ steps.pins.outputs.engine }}
          C: ${{ steps.pins.outputs.codegen }}
          PRERELEASE: ${{ steps.pair.outputs.prerelease }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # backticks here are literal markdown, not command substitution
          notes="$(printf 'Combined PineScript -> backtest image.\n\nengine %s + codegen %s\n\n```\ndocker pull ghcr.io/pineforge-4pass/pineforge-release:%s\n```\n' "$E" "$C" "${TAG#v}")"
          if [ "$PRERELEASE" = true ]; then
            # Never GitHub's "Latest": resolvers that read Latest keep the newest
            # stable release, and the image has no `latest` / X.Y tag either.
            # shellcheck disable=SC2016  # literal markdown backticks
            notes="$(printf '%s\n\nPrerelease: the image has only its fixed tags (this version, engine+codegen, sha); `latest` and X.Y stay on the newest stable release.\n' "$notes")"
            gh release create "$TAG" --title "$TAG" --verify-tag --notes "$notes" --prerelease --latest=false
            exit 0
          fi
          # Semver-aware "Latest": two near-simultaneous upstream releases run
          # handle-upstream serially, but their publish jobs can CREATE the
          # GitHub Releases out of version order, and GitHub's default Latest
          # is creation-ordered (observed 2026-07-12: v0.1.13 created 9s after
          # v0.1.14 stole Latest and downstream resolvers deployed the stale
          # bundle). Mark Latest explicitly iff TAG is the highest STABLE release
          # by semver precedence (coreutils' version sort ranks v1.0.0-rc.1 above v1.0.0).
          # Drafts never hold Latest, so a draft (say a hand-made v9.9.9) must not count.
          # A failing `gh release list` fails the step (it must not make TAG the max).
          releases="$(gh release list --exclude-drafts --limit 100 --json tagName -q '.[].tagName')"
          max_tag="$(printf '%s\n%s\n' "$TAG" "$releases" | python3 scripts/release_pair.py latest-tag --stable)"
          if [ "$max_tag" = "$TAG" ]; then latest_flag=true; else latest_flag=false; fi
          gh release create "$TAG" --title "$TAG" --verify-tag --notes "$notes" --latest=$latest_flag

  notify-consumers:
    needs: publish
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        consumer: [offline, hosted, application]
        include:
          - consumer: hosted
            repository_secret: RELEASE_HOSTED_MCP_REPOSITORY
          - consumer: application
            repository_secret: RELEASE_APPLICATION_REPOSITORY
    env:
      TARGET_REPOSITORY: ${{ matrix.consumer == 'offline' && 'pineforge-backtest-mcp' || secrets[matrix.repository_secret] }}
    steps:
      # A prerelease reaches the application by hand-off, so its leg sends nothing
      # for one and still ends green. The three steps after this one run only when
      # it decides to dispatch; a missing or malformed flag fails here, for every
      # consumer, before any repository check or token.
      - name: Decide consumer notification
        id: notify
        env:
          CONSUMER: ${{ matrix.consumer }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          set -euo pipefail
          case "$PRERELEASE" in
            true|false) ;;
            *) echo "::error::publish job gave no prerelease flag ('${PRERELEASE}')"; exit 1 ;;
          esac
          if [ "$CONSUMER" = application ] && [ "$PRERELEASE" = true ]; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
            echo 'Application is not notified for a prerelease; it receives the release by hand-off.'
          else
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require one configured consumer repository
        if: steps.notify.outputs.dispatch == 'true'
        run: |
          if ! [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo '::error::Missing or malformed consumer repository setup'; exit 1
          fi
      - name: Mint App token (scoped to one target)
        id: app
        if: steps.notify.outputs.dispatch == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: pineforge-4pass
          repositories: ${{ env.TARGET_REPOSITORY }}
          permission-contents: write
          github-api-url: https://api.github.com

      - name: Dispatch pineforge-release to consumer
        if: steps.notify.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ env.TARGET_REPOSITORY }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Consumers keep a prerelease off their production / latest channels.
          case "$PRERELEASE" in
            true|false) ;;
            *) echo "::error::publish job gave no prerelease flag ('${PRERELEASE}')"; exit 1 ;;
          esac
          gh api --hostname github.com repos/pineforge-4pass/"${REPO}"/dispatches \
            -f event_type=pineforge-release \
            -F "client_payload[release_version]=${TAG#v}" \
            -F "client_payload[prerelease]=${PRERELEASE}" \
            -F "client_payload[run_id]=${RUN_ID}"
          echo "dispatched pineforge-release (${TAG#v}, prerelease=${PRERELEASE})"
