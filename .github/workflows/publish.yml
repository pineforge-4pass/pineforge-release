name: publish

# Build and verify a candidate; the separate finalizer binds measured facts
# and all package identities before moving aliases and dispatching consumers.
# Fires on the v* tag that handle-upstream.yml pushes with the App
# token (or a manual tag). The tag value equals VERSION (asserted below).
# From 1.0.0 on the image pairs engine and codegen at the release version
# (scripts/release_pair.py check). The hpo cutoff also lives in that script:
# from it, the tag must explicitly pin hpo and the checked pin goes to the build.
# A prerelease tag (vX.Y.Z-rc.N) is published as a GitHub prerelease with the
# fixed tags X.Y.Z-rc.N, engine<E>-codegen<C>
# and sha-<short> only, and sends `prerelease: true` downstream; `latest` and
# the moving `X.Y` follow the newest stable release only.

on:
  push:
    tags: ["v*"]
  # Explicit replay runs on the existing tag; no tag rewrite is required.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}   # pineforge-4pass/pineforge-release

concurrency:
  group: release-candidate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub lists draft candidates only with push access
    outputs:
      exists: ${{ steps.candidate.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse an already verified candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_pipeline.py candidate-exists "$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: write   # append verified candidate to its draft release
      packages: write   # push to GHCR
    outputs:
      prerelease: ${{ steps.pair.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r facts/requirements-validation.txt

      - name: Assert tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="$(tr -d '[:space:]' < VERSION)"
          [ "${TAG#v}" = "$file" ] || { echo "::error::tag ${TAG} != VERSION ${file}"; exit 1; }

      - name: Read pins (from the annotated tag message; fallback = the pair version, or resolve latest on 0.x)
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver() { printf '%s' "$1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$'; }
          # actions/checkout@v4 re-points refs/tags/<tag> at the COMMIT it peels to,
          # so cat-file would see 'commit' and we'd never read the annotated message.
          # Re-fetch tags (forced) to restore the annotated tag objects.
          git fetch --force --tags origin >/dev/null 2>&1 || true
          facts="$(python3 scripts/release_pair.py info "$REF")"
          hpo_pairing="$(printf '%s\n' "$facts" | sed -n 's/^hpo_pairing=//p')"
          e=""; c=""; h=""
          # Trust the tag message ONLY if REF is an ANNOTATED tag — a lightweight
          # tag's %(contents:body) leaks the target commit body, not our keys.
          if [ "$(git cat-file -t "$REF" 2>/dev/null || true)" = tag ]; then
            e="$(git for-each-ref --format='%(contents:body)' "refs/tags/$REF" | sed -n 's/^engine=//p'  | head -1)"
            c="$(git for-each-ref --format='%(contents:body)' "refs/tags/$REF" | sed -n 's/^codegen=//p' | head -1)"
            if [ "$hpo_pairing" = true ]; then
              h="$(git for-each-ref --format='%(contents:body)' "refs/tags/$REF" | sed -n 's/^hpo=//p' | head -1)"
            fi
          fi
          if ! semver "$e" || ! semver "$c"; then
            line="$(printf '%s\n' "$facts" | sed -n 's/^line=//p')"
            if [ "$line" = pair ]; then
              # From 1.0.0 on the release version IS the pair version.
              echo "::warning::tag ${REF} lacks valid engine=/codegen= in its message — using the pair version ${REF#v}"
              e="${REF#v}"; c="${REF#v}"
            else
              echo "::warning::tag ${REF} lacks valid engine=/codegen= in its message — resolving latest (manual-tag path)"
              for _attempt in 1 2 3 4 5; do e="$(gh release view -R pineforge-4pass/pineforge-engine --json tagName -q .tagName 2>/dev/null || true)"; [ -n "$e" ] && break; sleep 5; done
              e="${e#v}"
              for _attempt in 1 2 3 4 5; do c="$(curl -fsSL https://pypi.org/pypi/pineforge-codegen/json 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || true)"; [ -n "$c" ] && break; sleep 5; done
            fi
          fi
          semver "$e" || { echo "::error::bad engine version '$e'"; exit 1; }
          semver "$c" || { echo "::error::bad codegen version '$c'"; exit 1; }
          if [ "$hpo_pairing" = true ]; then
            semver "$h" || { echo "::error::tag ${REF} (engine ${e} + codegen ${c}) requires valid hpo= in its annotated message; got '${h}'"; exit 1; }
          fi
          { echo "engine=$e"; echo "codegen=$c"; if [ "$hpo_pairing" = true ]; then echo "hpo=$h"; fi; } >> "$GITHUB_OUTPUT"
          echo "pins: engine=$e codegen=$c${h:+ hpo=$h}"

      # From 1.0.0 on engine and codegen share one version, prerelease included,
      # and the release version is that version: a mismatched pair fails here
      # naming both, before anything is built. The 0.x line keeps independent
      # pins and is stable-only. Emits line, prerelease, codegen_pypi, and
      # moving (a stable release that is the newest stable tag when this run
      # starts: re-running an older release never moves `latest` / X.Y back;
      # two publish runs that overlap can still finish out of order).
      - name: Pairing rule + release channel
        id: pair
        env:
          REF: ${{ github.ref_name }}
          E: ${{ steps.pins.outputs.engine }}
          C: ${{ steps.pins.outputs.codegen }}
          H: ${{ steps.pins.outputs.hpo }}
        run: |
          set -euo pipefail
          newest="$(git tag -l 'v*' | python3 scripts/release_pair.py latest-tag --stable)"
          hpo=()
          [ -z "$H" ] || hpo=(--hpo="$H")
          python3 scripts/release_pair.py check --release="${REF#v}" --engine="$E" --codegen="$C" \
            --newest-stable="$newest" "${hpo[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for upstream artifacts (engine tarballs + codegen on PyPI)
        env:
          E: ${{ steps.pins.outputs.engine }}
          C: ${{ steps.pins.outputs.codegen }}
          CP: ${{ steps.pair.outputs.codegen_pypi }}
          H: ${{ steps.pair.outputs.hpo_pep440 }}
        run: |
          set -euo pipefail
          # The Dockerfile builds FROM the engine static-lib tarball (per arch),
          # not a Docker image. Confirm both arch tarballs + the codegen version
          # are published before building (the build fetch fails loud anyway).
          # PyPI spells a codegen prerelease the PEP 440 way (1.0.0rc1); pip
          # reads the Dockerfile's ==1.0.0-rc.1 pin as that same version.
          base="https://github.com/pineforge-4pass/pineforge-engine/releases/download/v${E}"
          hpo_ready() {
            [ -n "$H" ] || return 0
            local code
            code="$(curl -sSIL -o /dev/null -w '%{http_code}' --max-time 30 \
              --retry 4 --retry-delay 5 --retry-all-errors \
              "https://github.com/pineforge-4pass/pineforge-hpo/releases/download/v${H}/pineforge_hpo-${H}-py3-none-any.whl" 2>/dev/null || true)"
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::could not tell whether hpo ${H} is published (HTTP ${code:-no status}); re-run this job"; exit 1 ;;
            esac
          }
          ok=
          for i in $(seq 1 20); do
            if curl -fsIL "${base}/pineforge-v${E}-linux-x86_64.tar.gz"  >/dev/null 2>&1 \
               && curl -fsIL "${base}/pineforge-v${E}-linux-aarch64.tar.gz" >/dev/null 2>&1 \
               && curl -fsSL "https://pypi.org/pypi/pineforge-codegen/${CP}/json" >/dev/null 2>&1 \
               && hpo_ready; then
              ok=1; break
            fi
            echo "waiting for engine ${E} tarballs + codegen ${C} (PyPI ${CP})${H:+ + hpo ${H}} ... (${i})"
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::engine ${E} tarballs or codegen ${C}${H:+ or hpo ${H}} not available after wait"; exit 1; }

      - name: Bind producer source and package bytes
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          E: ${{ steps.pins.outputs.engine }}
          C: ${{ steps.pins.outputs.codegen }}
          H: ${{ steps.pins.outputs.hpo }}
          HUB_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_pipeline.py bindings --release-version="${TAG#v}" \
            --engine="$E" --codegen="$C" --hpo="$H" --hub-commit="$HUB_COMMIT" \
            --output "$RUNNER_TEMP/release-bindings.json"
          python3 - <<'PYBIND' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from scripts.release_sources import hpo_artifact_args
          obj = json.loads(Path(os.environ['RUNNER_TEMP'], 'release-bindings.json').read_bytes())
          hpo = obj['versions']['hpo']
          if hpo:
              for output, argument in hpo_artifact_args(hpo).items():
                  print(output + '=' + argument)
          PYBIND

      - name: Read hpo wheel digest
        id: wheel
        if: steps.pair.outputs.target == 'hpo'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
          E: ${{ steps.pins.outputs.engine }}
          C: ${{ steps.pins.outputs.codegen }}
          H: ${{ steps.pair.outputs.hpo }}
          HP: ${{ steps.pair.outputs.hpo_pep440 }}
        run: |
          set -euo pipefail
          asset="pineforge_hpo-${HP}-py3-none-any.whl"
          digest="$(gh api "repos/pineforge-4pass/pineforge-hpo/releases/tags/v${HP}" \
            -q ".assets[] | select(.name == \"${asset}\") | .digest // empty")" \
            || { echo "::error::could not read hpo ${HP} release asset metadata; re-run this job"; exit 1; }
          # Older assets may have no digest. A supplied digest must be a SHA256.
          python3 scripts/release_pair.py check --release="${REF#v}" --engine="$E" --codegen="$C" \
            --hpo="$H" --hpo-wheel-digest="$digest" | tee -a "$GITHUB_OUTPUT"

      - name: Read hpo toolchain arguments
        id: toolchain
        if: steps.pair.outputs.target == 'hpo'
        run: |
          set -euo pipefail
          args="$(python3 scripts/release_sources.py toolchain-args docker/hpo-toolchain.args)"
          {
            echo 'args<<HPO_TOOLCHAIN_ARGS'
            printf '%s\n' "$args"
            echo 'HPO_TOOLCHAIN_ARGS'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Candidate only. The finalizer assigns fixed/moving release tags
          # after both architectures, packages and measured facts are verified.
          flavor: |
            latest=false
          tags: |
            type=raw,value=candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The action derives the licences label from this repository's
          # Apache-2.0, and its labels override the Dockerfile's. The image also
          # bundles the transpiler, whose LICENSE from codegen 1.3.0 is the
          # PineForge Source License 1.2 (see README, License).
          labels: |
            org.opencontainers.image.licenses=Apache-2.0 AND LicenseRef-PineForge-Source-License-1.2
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Inspect the selected target on both architectures before any publish.
      # Keep target and arguments identical to the push steps; the cache scope is per architecture and shared with them.
      - name: Inspect release amd64
        if: steps.pair.outputs.target != 'hpo'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pineforge-source-inspect:amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_VERSION=${{ steps.pins.outputs.engine }}
            CODEGEN_VERSION=${{ steps.pins.outputs.codegen }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,scope=release-amd64,mode=max

      - name: Inspect release arm64
        if: steps.pair.outputs.target != 'hpo'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: pineforge-source-inspect:arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_VERSION=${{ steps.pins.outputs.engine }}
            CODEGEN_VERSION=${{ steps.pins.outputs.codegen }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,scope=release-arm64,mode=max

      - name: Inspect hpo amd64
        if: steps.pair.outputs.target == 'hpo'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ steps.pair.outputs.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: pineforge-source-inspect:amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_VERSION=${{ steps.pins.outputs.engine }}
            CODEGEN_VERSION=${{ steps.pins.outputs.codegen }}
            ${{ steps.pair.outputs.hpo_version_arg }}
            ${{ steps.binding.outputs.hpo_wheel_arg }}
            ${{ steps.binding.outputs.hpo_sdist_arg }}
            ${{ steps.toolchain.outputs.args }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=hpo-amd64
          cache-to: type=gha,scope=hpo-amd64,mode=max

      - name: Inspect hpo arm64
        if: steps.pair.outputs.target == 'hpo'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ steps.pair.outputs.target }}
          platforms: linux/arm64
          load: true
          push: false
          tags: pineforge-source-inspect:arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_VERSION=${{ steps.pins.outputs.engine }}
            CODEGEN_VERSION=${{ steps.pins.outputs.codegen }}
            ${{ steps.pair.outputs.hpo_version_arg }}
            ${{ steps.binding.outputs.hpo_wheel_arg }}
            ${{ steps.binding.outputs.hpo_sdist_arg }}
            ${{ steps.toolchain.outputs.args }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=hpo-arm64
          cache-to: type=gha,scope=hpo-arm64,mode=max

      - name: Read Debian package inventories
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint dpkg-query pineforge-source-inspect:amd64 \
            -W -f='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' > "$RUNNER_TEMP/debian-amd64.tsv"
          docker run --rm --platform linux/arm64 --entrypoint dpkg-query pineforge-source-inspect:arm64 \
            -W -f='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' > "$RUNNER_TEMP/debian-arm64.tsv"

      - name: Locate Debian source bundle
        id: source_set
        run: |
          set -euo pipefail
          python3 scripts/release_sources.py locate --registry docker/SOURCE-SETS.tsv \
            --amd64 "$RUNNER_TEMP/debian-amd64.tsv" --arm64 "$RUNNER_TEMP/debian-arm64.tsv" | tee -a "$GITHUB_OUTPUT"

      - name: Read Debian source release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ steps.source_set.outputs.release-tag }}
          SOURCE_LIST: ${{ steps.source_set.outputs.list-asset }}
        run: |
          set -euo pipefail
          gh release view "$SOURCE_TAG" --repo pineforge-4pass/pineforge-release --json assets > "$RUNNER_TEMP/source-assets.json"
          curl -fsSL --retry 3 --max-time 120 \
            "https://github.com/pineforge-4pass/pineforge-release/releases/download/${SOURCE_TAG}/${SOURCE_LIST}" \
            -o "$RUNNER_TEMP/$SOURCE_LIST"

      - name: Check Debian source mirror
        env:
          SOURCE_LIST: ${{ steps.source_set.outputs.list-asset }}
        run: |
          set -euo pipefail
          python3 scripts/release_sources.py check --registry docker/SOURCE-SETS.tsv \
            --amd64 "$RUNNER_TEMP/debian-amd64.tsv" --arm64 "$RUNNER_TEMP/debian-arm64.tsv" \
            --release-assets "$RUNNER_TEMP/source-assets.json" --sources-list "$RUNNER_TEMP/$SOURCE_LIST"

      - name: Build + push (multi-arch)
        id: push_release
        if: steps.pair.outputs.target != 'hpo'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_VERSION=${{ steps.pins.outputs.engine }}
            CODEGEN_VERSION=${{ steps.pins.outputs.codegen }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_GIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=release-amd64
            type=gha,scope=release-arm64
          cache-to: |
            type=gha,scope=release-amd64,mode=max
            type=gha,scope=release-arm64,mode=max

      - name: Build + push hpo (multi-arch)
        id: push_hpo
        if: steps.pair.outputs.target == 'hpo'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ steps.pair.outputs.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_VERSION=${{ steps.pins.outputs.engine }}
            CODEGEN_VERSION=${{ steps.pins.outputs.codegen }}
            ${{ steps.pair.outputs.hpo_version_arg }}
            ${{ steps.binding.outputs.hpo_wheel_arg }}
            ${{ steps.binding.outputs.hpo_sdist_arg }}
            ${{ steps.toolchain.outputs.args }}
            RELEASE_VERSION=${{ github.ref_name }}
            RELEASE_GIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=hpo-amd64
            type=gha,scope=hpo-arm64
          cache-to: |
            type=gha,scope=hpo-amd64,mode=max
            type=gha,scope=hpo-arm64,mode=max

      - name: Check pushed Debian source mirror
        env:
          RELEASE_DIGEST: ${{ steps.push_release.outputs.digest }}
          HPO_DIGEST: ${{ steps.push_hpo.outputs.digest }}
          RELEASE_PUSH_OUTCOME: ${{ steps.push_release.outcome }}
          HPO_PUSH_OUTCOME: ${{ steps.push_hpo.outcome }}
          SOURCE_LIST: ${{ steps.source_set.outputs.list-asset }}
        run: |
          set -euo pipefail
          # This DETECTS drift; candidate tags are already pushed
          # and sources are never deleted.
          # Only a candidate tag exists. Fixed versions and moving aliases
          # remain untouched until the finalizer has all readiness evidence.
          case "${RELEASE_PUSH_OUTCOME}:${HPO_PUSH_OUTCOME}" in
            success:skipped) digest="$RELEASE_DIGEST" ;;
            skipped:success) digest="$HPO_DIGEST" ;;
            *) echo "::error::expected exactly one successful image push"; exit 1 ;;
          esac
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::missing or malformed pushed image digest"; exit 1; }
          image="${REGISTRY}/${IMAGE}@${digest}"
          # The local image store cannot hold both platforms under one index digest.
          index="$(docker buildx imagetools inspect --raw "$image")" \
            || { echo "::error::could not read pushed image index"; exit 1; }
          child_digest() {
            local arch="$1" child
            child="$(jq -er --arg arch "$arch" '
              [.manifests[]
               | select(.platform.os == "linux" and .platform.architecture == $arch)
               | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")]
              | if length == 1 then .[0].digest
                else error("expected exactly one linux/" + $arch + " image manifest") end
            ' <<< "$index")" \
              || { echo "::error::expected exactly one linux/${arch} image manifest in pushed index" >&2; return 1; }
            [[ "$child" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::missing or malformed linux/${arch} child digest" >&2; return 1; }
            printf '%s\n' "$child"
          }
          amd64_child="$(child_digest amd64)"
          arm64_child="$(child_digest arm64)"
          [[ "$amd64_child" != "$arm64_child" ]] \
            || { echo "::error::amd64 and arm64 image manifests share a child digest"; exit 1; }
          docker pull "${REGISTRY}/${IMAGE}@${amd64_child}"
          docker run --rm --platform linux/amd64 --entrypoint dpkg-query "${REGISTRY}/${IMAGE}@${amd64_child}" \
            -W -f='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' > "$RUNNER_TEMP/pushed-debian-amd64.tsv"
          docker pull "${REGISTRY}/${IMAGE}@${arm64_child}"
          docker run --rm --platform linux/arm64 --entrypoint dpkg-query "${REGISTRY}/${IMAGE}@${arm64_child}" \
            -W -f='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' > "$RUNNER_TEMP/pushed-debian-arm64.tsv"
          python3 scripts/release_sources.py check --registry docker/SOURCE-SETS.tsv \
            --amd64 "$RUNNER_TEMP/pushed-debian-amd64.tsv" --arm64 "$RUNNER_TEMP/pushed-debian-arm64.tsv" \
            --release-assets "$RUNNER_TEMP/source-assets.json" --sources-list "$RUNNER_TEMP/$SOURCE_LIST"

      - name: Verify real candidate runtime on both architectures
        env:
          DIGEST: ${{ steps.push_release.outputs.digest || steps.push_hpo.outputs.digest }}
        run: |
          python3 scripts/release_smoke.py --bindings "$RUNNER_TEMP/release-bindings.json" \
            --digest "$DIGEST" --output "$RUNNER_TEMP/release-verified.json"

      # Store the verified candidate as a draft; only the finalizer publishes it.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          E: ${{ steps.pins.outputs.engine }}
          C: ${{ steps.pins.outputs.codegen }}
          H: ${{ steps.pins.outputs.hpo }}
          PRERELEASE: ${{ steps.pair.outputs.prerelease }}
          SOURCE_TAG: ${{ steps.source_set.outputs.release-tag }}
          SOURCE_LIST: ${{ steps.source_set.outputs.list-asset }}
        run: |
          set -euo pipefail
          components="engine ${E} + codegen ${C}${H:+ + hpo ${H}}"
          printf 'Combined PineScript -> backtest image.\n\n%s\n\nReadiness requires the immutable release-manifest.json.\n\nDebian sources: [SOURCES.list](https://github.com/pineforge-4pass/pineforge-release/releases/download/%s/%s) and source assets at [release %s](https://github.com/pineforge-4pass/pineforge-release/releases/tag/%s).\n' \
            "$components" "$SOURCE_TAG" "$SOURCE_LIST" "$SOURCE_TAG" "$SOURCE_TAG" > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/release_pipeline.py candidate --file "$RUNNER_TEMP/release-verified.json" \
            --tag "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --source-tag "$SOURCE_TAG" --source-list "$RUNNER_TEMP/$SOURCE_LIST" \
            --amd64 "$RUNNER_TEMP/pushed-debian-amd64.tsv" --arm64 "$RUNNER_TEMP/pushed-debian-arm64.tsv"

  notify-consumers:
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    uses: ./.github/workflows/release-finalize.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
      issues: write

  failure-report:
    needs: [prepare, publish, notify-consumers]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Report failed publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
        run: python3 scripts/release_pipeline.py alert --stage publish
