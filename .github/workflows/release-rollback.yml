name: release-rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Rejected ready release tag whose recorded aliases should be restored
        type: string
        required: true

permissions:
  contents: write
  packages: write
  issues: write

# Same lock as finalization, including fan-out. An in-flight delivery completes
# first; rejection prevents any subsequent replay of that manifest.
concurrency:
  group: release-finalize
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ["self-hosted","pf-ci","pf-ci-release"]
    environment: release-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stop fan-out and restore recorded moving aliases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
        run: python3 scripts/release_rollback.py --tag "$TAG"
