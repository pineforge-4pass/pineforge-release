name: release-rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Rejected ready release tag whose recorded aliases should be restored
        type: string
        required: true

permissions:
  contents: write
  packages: write
  issues: write

# Same lock as finalization, including fan-out. An in-flight delivery completes
# first; rejection prevents any subsequent replay of that manifest.
concurrency:
  group: release-finalize
  cancel-in-progress: false

jobs:
  restore:
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    environment: release-automation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stop fan-out and restore recorded moving aliases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
        run: python3 scripts/release_rollback.py --tag "$TAG"
