name: release-reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: release-reconcile-producers
  cancel-in-progress: false

jobs:
  producers:
    if: github.ref == 'refs/heads/main'
    # pineforge-release runs on GitHub-hosted runners; standing exception for this repository
    runs-on: ubuntu-latest
    environment: release-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require full main proof before producer reconciliation
        id: main-proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_main_proof.py commit --sha "$(git rev-parse HEAD)"
      - name: Mint hub-only dispatch token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pineforge-release
          permission-contents: write
          github-api-url: https://api.github.com
      - name: Verify artifacts and replay missed stable producer events
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
          RELEASE_REPORT_TOKEN: ${{ github.token }}
        run: python3 scripts/release_pipeline.py reconcile
      - name: Report reconciliation failure
        if: ${{ failure() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPORT_OWNER: ${{ vars.RELEASE_REPORT_OWNER }}
        run: python3 scripts/release_pipeline.py alert --stage producer
