version: 2
updates:
  # One grouped PR a week for every action bump. Major bumps of release-chain
  # actions are reviewed and merged by hand (CORE-TOP card CR-135), never
  # auto-merged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
